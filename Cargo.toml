[package]
name = "zeus"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Evidence-driven native agent runtime with bounded workers and learned routing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", features = ["json"] }
libc = "0.2"
base64 = "0.22"
ring = "0.17"
url = "2.5"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
